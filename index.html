<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gym Tracker Global</title>
    <style>
        :root {
            --primary: #3b82f6;
            --bg: #0f172a;
            --card: #1e293b;
            --card-highlight: #2a3855;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --danger: #ef4444;
            --success: #10b981;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Top Bar & Language */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px 0 20px;
        }
        
        .lang-select {
            background: var(--card);
            color: var(--text);
            border: 1px solid #475569;
            padding: 5px 10px;
            border-radius: 8px;
            font-size: 0.85rem;
        }

        /* Navigation Tabs */
        .nav-tabs {
            display: flex;
            background-color: var(--card);
            border-top: 1px solid #334155;
            padding-bottom: env(safe-area-inset-bottom);
        }

        .nav-item {
            flex: 1;
            text-align: center;
            padding: 15px;
            color: var(--text-muted);
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }

        .nav-item.active {
            color: var(--primary);
            border-top: 3px solid var(--primary);
        }

        /* Main Scrollable Area */
        .content-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            padding-bottom: 80px;
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        h1 { margin: 10px 0 20px 0; font-size: 1.8rem; }
        h2 { font-size: 1.2rem; border-bottom: 1px solid #334155; padding-bottom: 8px; margin-top: 25px;}

        /* Input Section */
        .input-card {
            background-color: var(--card);
            padding: 20px;
            border-radius: 16px;
            margin-bottom: 20px;
        }

        .mic-button {
            background-color: var(--primary);
            color: white;
            border: none;
            width: 100%;
            padding: 20px;
            font-size: 1.2rem;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 15px;
        }

        .mic-button.listening { background-color: var(--danger); animation: pulse 1.5s infinite; }

        .form-group { margin-bottom: 12px; }
        label { display: block; color: var(--text-muted); font-size: 0.85rem; margin-bottom: 4px; }
        
        input, select {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            background: #334155;
            border: 1px solid #475569;
            color: white;
            border-radius: 8px;
            font-size: 1rem;
        }

        .row { display: flex; gap: 10px; }

        .btn-add {
            background-color: var(--card-highlight);
            color: var(--primary);
            border: 1px solid var(--primary);
            width: 100%;
            padding: 12px;
            font-size: 1rem;
            border-radius: 8px;
            margin-top: 5px;
            font-weight: bold;
        }

        /* Current Session Styles */
        .current-session-box {
            border: 1px dashed #475569;
            border-radius: 12px;
            padding: 15px;
            margin-top: 20px;
            display: none; 
        }
        .current-session-box.active { display: block; }

        .session-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #334155;
        }
        .session-item:last-child { border-bottom: none; }

        .btn-finish {
            background-color: var(--success);
            color: white;
            border: none;
            width: 100%;
            padding: 15px;
            font-size: 1.1rem;
            border-radius: 8px;
            margin-top: 15px;
            font-weight: bold;
        }

        /* History & Progress Items */
        .workout-card, .progress-chart-item {
            background-color: var(--card);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
        }
        .workout-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            padding-bottom: 8px;
            border-bottom: 1px solid #334155;
        }
        .workout-date { color: var(--primary); font-weight: bold; font-size: 0.9rem; }
        
        .exercise-row {
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
            font-size: 0.95rem;
        }
        .ex-stats { color: var(--text-muted); }

        .btn-delete-workout {
            color: var(--danger);
            background: none;
            border: none;
            font-size: 0.8rem;
            padding: 5px;
        }

        .bar-container {
            background: #334155;
            height: 8px;
            border-radius: 4px;
            margin-top: 8px;
            overflow: hidden;
        }
        .bar-fill {
            background: var(--primary);
            height: 100%;
            width: 0%;
            transition: width 0.5s ease;
        }

        /* Backup Section */
        .backup-section {
            margin-top: 40px;
            border-top: 1px solid #334155;
            padding-top: 20px;
            text-align: center;
        }
        .btn-export, .btn-import {
            background-color: var(--card-highlight);
            color: white;
            border: 1px solid #475569;
            padding: 10px 20px;
            border-radius: 8px;
            margin: 5px;
            font-size: 0.9rem;
        }
        #fileInput { display: none; }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

<div class="top-bar">
    <div style="flex:1"></div> <!-- Spacer -->
    <select id="languageSelect" class="lang-select" onchange="changeLanguage(this.value)">
        <option value="en">English 🇺🇸</option>
        <option value="es">Español 🇪🇸</option>
        <option value="fr">Français 🇫🇷</option>
        <option value="de">Deutsch 🇩🇪</option>
        <option value="nl">Nederlands 🇳🇱</option>
    </select>
</div>

<div class="content-area">
    
    <!-- === LOG TAB === -->
    <div id="tab-log" class="tab-content active">
        <h1 data-i18n="log_title">Log Workout</h1>

        <div class="input-card">
            <button id="micBtn" class="mic-button">🎤 <span data-i18n="mic_tap">Tap to Speak</span></button>
            <p id="status" style="text-align: center; color: var(--text-muted); font-size: 0.85rem; min-height: 1.2em;">
                <span data-i18n="example_phrase">"Bench press 80kg for 5 reps"</span>
            </p>

            <div class="form-group">
                <label data-i18n="lbl_exercise">Exercise Name</label>
                <input type="text" id="exerciseInput" placeholder="">
            </div>

            <div class="row">
                <div class="form-group" style="flex: 1;">
                    <label data-i18n="lbl_weight">Weight</label>
                    <input type="number" id="weightInput" placeholder="0">
                </div>
                <div class="form-group" style="flex: 1;">
                    <label data-i18n="lbl_reps">Reps</label>
                    <input type="number" id="repsInput" placeholder="0">
                </div>
            </div>

            <button class="btn-add" onclick="addToCurrentSession()">+ <span data-i18n="btn_add">Add to Workout</span></button>
        </div>

        <div id="currentSessionBox" class="current-session-box">
            <h3 style="margin:0 0 10px 0; font-size: 1rem; color: var(--text-muted);" data-i18n="session_title">Current Session</h3>
            <div id="sessionList"></div>
            <button class="btn-finish" onclick="finishWorkout()">✅ <span data-i18n="btn_finish">Finish & Save</span></button>
        </div>

        <h2 data-i18n="history_title">Past Workouts</h2>
        <div id="historyList"></div>

        <div class="backup-section">
            <h3 style="font-size: 1rem; margin-bottom: 10px; color: var(--text-muted);" data-i18n="backup_title">Data Backup</h3>
            <button class="btn-export" onclick="exportCSV()">⬇ <span data-i18n="btn_export">Export CSV</span></button>
            <button class="btn-import" onclick="document.getElementById('fileInput').click()">⬆ <span data-i18n="btn_import">Import CSV</span></button>
            <input type="file" id="fileInput" accept=".csv" onchange="importCSV(this)">
            <p style="font-size: 0.75rem; color: var(--text-muted); margin-top:10px;" data-i18n="backup_msg">Save your data before switching phones.</p>
        </div>
    </div>

    <!-- === PROGRESS TAB === -->
    <div id="tab-progress" class="tab-content">
        <h1 data-i18n="progress_title">Progress</h1>
        <div class="form-group">
            <label data-i18n="lbl_select_ex">Select Exercise</label>
            <select id="progressSelect" onchange="renderProgressChart()">
                <option value="" data-i18n="select_placeholder">Select an exercise...</option>
            </select>
        </div>
        <div id="progressResults"></div>
    </div>

</div>

<div class="nav-tabs">
    <div class="nav-item active" onclick="switchTab('log')" data-i18n="tab_log">Log Workout</div>
    <div class="nav-item" onclick="switchTab('progress')" data-i18n="tab_progress">Progress</div>
</div>

        },

        },
        de: {

            log_title: "Trainingstagebuch",

            example_phrase: "\"Kniebeugen 80kg für 5 Wiederholungen\"",
            lbl_exercise: "Übung",
            lbl_weight: "Gewicht",
            lbl_reps: "Wiederholungen",
            btn_add: "Hinzufügen",

            progress_title: "Fortschritt",

            alert_finish: "Training beenden und speichern?",
            alert_delete: "Eintrag löschen?",
            import_success: "Import erfolgreich!",
            select_placeholder: "Übung auswählen...",
            keys_reps: ['reps', 'wiederholungen', 'wdh'],
            keys_weight: ['kg', 'pfund', 'kilos', 'kilogramm'],
            keys_connectors: ['für', 'mit', 'bei', 'x', 'von']
        },
        nl: {
            code: 'nl-NL',
            log_title: "Workout Log",
            mic_tap: "Tik om te spreken",
            mic_listening: "Luisteren...",
            example_phrase: "\"Bankdrukken 80kg voor 5 herhalingen\"",
            lbl_exercise: "Oefening",
            lbl_weight: "Gewicht",
            lbl_reps: "Herhalingen",
            btn_add: "Toevoegen",
            session_title: "Huidige Sessie",
            btn_finish: "Afronden & Opslaan",
            history_title: "Geschiedenis",
            backup_title: "Back-up",
            btn_export: "Exporteer CSV",
            btn_import: "Importeer CSV",
            backup_msg: "Sla je gegevens op voordat je van telefoon wisselt.",
            progress_title: "Voortgang",
            lbl_select_ex: "Selecteer Oefening",
            tab_log: "Logboek",
            tab_progress: "Voortgang",
            alert_enter_name: "Voer een oefening naam in",
            alert_finish: "Training opslaan?",
            alert_delete: "Verwijderen?",
            import_success: "Import geslaagd!",
            select_placeholder: "Selecteer een oefening...",
            keys_reps: ['reps', 'herhalingen', 'keer', 'maal'],
            keys_weight: ['kg', 'kilo', 'kilogram'],
            keys_connectors: ['voor', 'met', 'op', 'x', 'van']
        }
    };

    let currentLang = localStorage.getItem('gymLang') || 'en';
    let currentSession = [];

    // === UI & INIT ===
    function changeLanguage(lang) {
        currentLang = lang;
        localStorage.setItem('gymLang', lang);
        
        // Update HTML Elements
        document.querySelectorAll('[data-i18n]').forEach(el => {
            const key = el.getAttribute('data-i18n');
            if (translations[lang][key]) {
                el.innerText = translations[lang][key];
            }
        });

        // Update Placeholders
        document.getElementById('exerciseInput').placeholder = translations[lang].lbl_exercise;
        
        // Update Dropdown
        document.getElementById('languageSelect').value = lang;
        
        // Update Mic Language - only if recognition exists
        if (typeof recognition !== 'undefined' && recognition) {
            recognition.lang = translations[lang].code;
        }

        // Refresh dynamic content
        updateProgressDropdown();
        renderHistory();
    }
    // Don't call changeLanguage here - remove this line:
    // changeLanguage(currentLang);

    // === SPEECH RECOGNITION ===
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const micBtn = document.getElementById('micBtn');
    const statusText = document.getElementById('status');
    let recognition;

    if (SpeechRecognition) {
        recognition = new SpeechRecognition();
        recognition.continuous = false;
        recognition.interimResults = false;
        
        micBtn.addEventListener('click', toggleMic);

        recognition.onstart = () => {
            micBtn.classList.add('listening');
            // Make sure span exists before updating
            const span = micBtn.querySelector('span');
            if (span) {
                span.innerText = translations[currentLang].mic_listening;
            }
        };

        recognition.onend = () => {
            micBtn.classList.remove('listening');
            const span = micBtn.querySelector('span');
            if (span) {
                span.innerText = translations[currentLang].mic_tap;
            }
        };

        recognition.onresult = (event) => {
            const transcript = event.results[0][0].transcript;
            parseAndFill(transcript);
        };
    } else {
        micBtn.style.display = 'none';
        statusText.innerText = "Voice not supported.";
    }

    // Initialize language AFTER recognition is set up
    changeLanguage(currentLang);

    function toggleMic() {
        if (micBtn.classList.contains('listening')) recognition.stop();
        else {
            recognition.lang = translations[currentLang].code;
            recognition.start();
        }
    }

    // === MULTI-LINGUAL PARSING LOGIC ===
    function parseAndFill(text) {
        let cleanText = text.toLowerCase();
        let weight = null;
        let reps = null;
        
        const t = translations[currentLang];

        // Convert written numbers to digits (for common small numbers)
        const numberWords = {
            'en': {'one':1,'two':2,'three':3,'four':4,'five':5,'six':6,'seven':7,'eight':8,'nine':9,'ten':10,'eleven':11,'twelve':12,'fifteen':15,'twenty':20,'thirty':30},
            'nl': {'een':1,'twee':2,'drie':3,'vier':4,'vijf':5,'zes':6,'zeven':7,'acht':8,'negen':9,'tien':10,'elf':11,'twaalf':12,'vijftien':15,'twintig':20,'dertig':30},
            'es': {'uno':1,'dos':2,'tres':3,'cuatro':4,'cinco':5,'seis':6,'siete':7,'ocho':8,'nueve':9,'diez':10,'once':11,'doce':12,'quince':15,'veinte':20,'treinta':30},
            'fr': {'un':1,'deux':2,'trois':3,'quatre':4,'cinq':5,'six':6,'sept':7,'huit':8,'neuf':9,'dix':10,'onze':11,'douze':12,'quinze':15,'vingt':20,'trente':30},
            'de': {'ein':1,'eins':1,'zwei':2,'drei':3,'vier':4,'fünf':5,'sechs':6,'sieben':7,'acht':8,'neun':9,'zehn':10,'elf':11,'zwölf':12,'fünfzehn':15,'zwanzig':20,'dreißig':30}
        };

        // Replace written numbers with digits
        if (numberWords[currentLang]) {
            Object.keys(numberWords[currentLang]).forEach(word => {
                const regex = new RegExp(`\\b${word}\\b`, 'gi');
                cleanText = cleanText.replace(regex, numberWords[currentLang][word]);
            });
        }

        // 1. First extract reps with keywords
        const repWords = t.keys_reps.join('|');
        const repRegex = new RegExp(`(\\d+)\\s*(${repWords})`, 'i');
        const repsMatch = cleanText.match(repRegex);
        
        if (repsMatch) {
            reps = repsMatch[1];
            cleanText = cleanText.replace(repsMatch[0], '').trim(); 
        }

        // 2. Extract weight with keywords
        const weightWords = t.keys_weight.join('|');
        const weightRegex = new RegExp(`(\\d+)\\s*(${weightWords})`, 'i');
        const weightMatch = cleanText.match(weightRegex);

        if (weightMatch) {
            weight = weightMatch[1];
            cleanText = cleanText.replace(weightMatch[0], '').trim();
        }

        // 3. Look for patterns like "5 x" or "x 5" (common rep notation)
        if (!reps) {
            const xPattern = cleanText.match(/(\d+)\s*x\b|x\s*(\d+)/i);
            if (xPattern) {
                reps = xPattern[1] || xPattern[2];
                cleanText = cleanText.replace(xPattern[0], '').trim();
            }
        }

        // 4. Check for standalone numbers
        const numbers = [...cleanText.matchAll(/\b(\d+)\b/g)];
        numbers.forEach(match => {
            const num = match[1];
            const numValue = parseInt(num);
            
            // If we don't have reps and the number is small, assume it's reps
            if (!reps && numValue <= 30) {
                reps = num;
                cleanText = cleanText.replace(match[0], '').trim();
            } 
            // Otherwise if we don't have weight, assume it's weight
            else if (!weight && numValue > 30) {
                weight = num;
                cleanText = cleanText.replace(match[0], '').trim();
            }
        });

        // 5. Final check: if we only have one number and nothing else, it's probably reps
        if (!reps && !weight) {
            const lastNumber = cleanText.match(/\b(\d+)\b/);
            if (lastNumber) {
                reps = lastNumber[1];
                cleanText = cleanText.replace(lastNumber[0], '').trim();
            }
        }

        // 6. Clean up connector words (localized)
        let exerciseName = cleanText;
        const connectors = t.keys_connectors;
        connectors.forEach(word => {
            const regex = new RegExp(`\\b${word}\\b`, 'gi');
            exerciseName = exerciseName.replace(regex, '').trim();
        });

        // Clean up special chars and extra spaces
        exerciseName = exerciseName.replace(/[^a-zA-Z\u00C0-\u00FF\s]/g, '').trim();
        exerciseName = exerciseName.replace(/\s+/g, ' ');
        
        if(exerciseName.length > 0) {
            exerciseName = exerciseName.charAt(0).toUpperCase() + exerciseName.slice(1);
        }

        // Fill in the fields
        if (exerciseName) document.getElementById('exerciseInput').value = exerciseName;
        if (weight) document.getElementById('weightInput').value = weight;
        if (reps) document.getElementById('repsInput').value = reps;
        
        statusText.innerText = `"${text}"`;
    }

    // === WORKOUT LOGIC ===
    function addToCurrentSession() {
        const exInput = document.getElementById('exerciseInput');
        const wInput = document.getElementById('weightInput');
        const rInput = document.getElementById('repsInput');

        const name = exInput.value.trim();
        if (!name) return alert(translations[currentLang].alert_enter_name);

        currentSession.push({
            id: Date.now() + Math.random(),
            name: name,
            weight: wInput.value || 0,
            reps: rInput.value || 0
        });

        exInput.value = ''; wInput.value = ''; rInput.value = '';
        exInput.focus();
        renderSession();
    }

    function removeSessionItem(id) {
        currentSession = currentSession.filter(item => item.id !== id);
        renderSession();
    }

    function renderSession() {
        const container = document.getElementById('currentSessionBox');
        const list = document.getElementById('sessionList');
        
        if (currentSession.length === 0) {
            container.classList.remove('active');
            return;
        }
        
        container.classList.add('active');
        list.innerHTML = currentSession.map(item => `
            <div class="session-item">
                <span style="color:white;">${item.name}</span>
                <span style="color:var(--text-muted);">${item.weight}kg x ${item.reps} <span onclick="removeSessionItem(${item.id})" style="color:var(--danger); margin-left:10px; cursor:pointer;">✕</span></span>
            </div>
        `).join('');
    }

    function finishWorkout() {
        if (currentSession.length === 0) return;
        if (!confirm(translations[currentLang].alert_finish)) return;

        let allWorkouts = JSON.parse(localStorage.getItem('gymWorkouts') || '[]');
        allWorkouts.unshift({
            id: Date.now(),
            date: new Date().toISOString(),
            exercises: currentSession
        });
        localStorage.setItem('gymWorkouts', JSON.stringify(allWorkouts));

        currentSession = [];
        renderSession();
        renderHistory();
        updateProgressDropdown();
    }

    function deleteWorkout(id) {
        if(!confirm(translations[currentLang].alert_delete)) return;
        let allWorkouts = JSON.parse(localStorage.getItem('gymWorkouts') || '[]');
        allWorkouts = allWorkouts.filter(w => w.id !== id);
        localStorage.setItem('gymWorkouts', JSON.stringify(allWorkouts));
        renderHistory();
        updateProgressDropdown();
    }

    function renderHistory() {
        const historyList = document.getElementById('historyList');
        const allWorkouts = JSON.parse(localStorage.getItem('gymWorkouts') || '[]');
        
        if (allWorkouts.length === 0) {
            historyList.innerHTML = '<p style="text-align:center; color: var(--text-muted);">No history found.</p>';
            return;
        }

        historyList.innerHTML = allWorkouts.map(workout => {
            const dateObj = new Date(workout.date);
            const dateStr = dateObj.toLocaleDateString() + " " + dateObj.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
            
            const exercisesHtml = workout.exercises.map(ex => `
                <div class="exercise-row">
                    <span class="ex-name">${ex.name}</span>
                    <span class="ex-stats">${ex.weight}kg x ${ex.reps}</span>
                </div>
            `).join('');

            return `
                <div class="workout-card">
                    <div class="workout-header">
                        <span class="workout-date">📅 ${dateStr}</span>
                        <button class="btn-delete-workout" onclick="deleteWorkout(${workout.id})">Delete</button>
                    </div>
                    ${exercisesHtml}
                </div>
            `;
        }).join('');
    }

    // === DATA EXPORT/IMPORT ===
    function exportCSV() {
        const allWorkouts = JSON.parse(localStorage.getItem('gymWorkouts') || '[]');
        if (allWorkouts.length === 0) return alert("No data");
        
        let csvContent = "data:text/csv;charset=utf-8,WorkoutID,Date,Exercise Name,Weight,Reps\n";
        allWorkouts.forEach(w => {
            w.exercises.forEach(e => {
                csvContent += `${w.id},"${w.date}","${e.name}",${e.weight},${e.reps}\n`;
            });
        });

        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", "gym_history.csv");
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }

    function importCSV(input) {
        const file = input.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            const text = e.target.result;
            const rows = text.split("\n").slice(1);
            const newMap = {};

            rows.forEach(row => {
                if (!row.trim()) return;
                const cols = row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(c => c.replace(/^"|"$/g, '').trim());
                if (cols.length < 5) return;

                const wId = parseInt(cols[0]);
                if (!newMap[wId]) newMap[wId] = { id: wId, date: cols[1], exercises: [] };
                newMap[wId].exercises.push({
                    id: Date.now() + Math.random(),
                    name: cols[2],
                    weight: cols[3],
                    reps: cols[4]
                });
            });

            let currentWorkouts = JSON.parse(localStorage.getItem('gymWorkouts') || '[]');
            const currentIds = new Set(currentWorkouts.map(w => w.id));
            
            Object.values(newMap).forEach(w => {
                if (!currentIds.has(w.id)) currentWorkouts.push(w);
            });

            currentWorkouts.sort((a, b) => new Date(b.date) - new Date(a.date));
            localStorage.setItem('gymWorkouts', JSON.stringify(currentWorkouts));
            
            alert(translations[currentLang].import_success);
            renderHistory();
            updateProgressDropdown();
        };
        reader.readAsText(file);
        input.value = '';
    }

    // === PROGRESS ===
    function updateProgressDropdown() {
        const allWorkouts = JSON.parse(localStorage.getItem('gymWorkouts') || '[]');
        const select = document.getElementById('progressSelect');
        const names = new Set();
        allWorkouts.forEach(w => w.exercises.forEach(e => names.add(e.name.trim())));
        
        const savedVal = select.value;
        select.innerHTML = `<option value="">${translations[currentLang].select_placeholder}</option>`;
        Array.from(names).sort().forEach(name => {
            const opt = document.createElement('option');
            opt.value = name;
            opt.innerText = name;
            select.appendChild(opt);
        });
        if (names.has(savedVal)) select.value = savedVal;
    }

    function renderProgressChart() {
        const name = document.getElementById('progressSelect').value;
        const resultsDiv = document.getElementById('progressResults');
        if (!name) { resultsDiv.innerHTML = ''; return; }

        const allWorkouts = JSON.parse(localStorage.getItem('gymWorkouts') || '[]');
        let dataPoints = [];
        
        allWorkouts.forEach(w => {
            w.exercises.forEach(e => {
                if (e.name.trim() === name) {
                    dataPoints.push({ date: new Date(w.date), weight: parseFloat(e.weight), reps: e.reps });
                }
            });
        });

        dataPoints.sort((a, b) => a.date - b.date);
        if (dataPoints.length === 0) { resultsDiv.innerHTML = ''; return; }

        const maxWeight = Math.max(...dataPoints.map(d => d.weight)) || 1;

        resultsDiv.innerHTML = dataPoints.map(d => {
            const widthPercentage = (d.weight / maxWeight) * 100;
            return `
                <div class="progress-chart-item">
                    <div style="display:flex; justify-content:space-between;">
                        <span style="font-size:0.85rem; color:var(--text-muted);">${d.date.toLocaleDateString()}</span>
                        <span style="font-weight:bold;">${d.weight}kg <span style="font-size:0.85rem; font-weight:normal;">x${d.reps}</span></span>
                    </div>
                    <div class="bar-container">
                        <div class="bar-fill" style="width: ${widthPercentage}%;"></div>
                    </div>
                </div>
            `;
        }).reverse().join('');
    }

    // === TABS ===
    function switchTab(tabName) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
        document.getElementById('tab-' + tabName).classList.add('active');
        
        const idx = tabName === 'log' ? 0 : 1;
        document.querySelectorAll('.nav-item')[idx].classList.add('active');
        if(tabName === 'progress') updateProgressDropdown();
    }

</script>
</body>
